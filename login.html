<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-login">


    <div class="login-container">
        <div class="login-box">
            <h2><a href="index.html">Bienvenidos a Tech House</a></h2>

            <p>Ingresa a tu cuenta para continuar</p>

            <form id="form-login">
                <div class="input-group">
                    <label for="usuario">Usuario o Email</label>
                    <input type="text" id="usuario" placeholder="Ej: usuario@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="opciones">
                    <label class="recordar">
                        <input type="checkbox" id="recordar"> Guardar contraseña
                    </label>
                    <a href="#" class="olvide">¿Olvidaste tu clave?</a>
                </div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <div class="volver">
                <a href="index.html">← Volver a la tienda</a>
            </div>
        </div>
    </div>

    <script src="./js/login.js">

    </script>
</body>

</html>
